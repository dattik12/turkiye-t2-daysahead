name: daily-t2-forecast

# 17:00 Turkiye = 14:00 UTC. Aksam kosusu: LEP(T)/LEP(T+1) yayimlanmis olur ->
# H1 modeli hedef gunun TEIAS plan oranini feature olarak kullanir (A/B: -0.09pp).
on:
  schedule:
    - cron: "30 6 * * *"   # 09:30 TR: GOP-oncesi sabah tazelemesi (LEP henuz yok, graceful 1.0)
    - cron: "0 14 * * *"   # 17:00 TR: LEP'li aksam kosusu (ana uretim)
  workflow_dispatch:      # elle de tetiklenebilir

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write EPIAS credentials (.env)
        shell: bash
        run: |
          printf 'EPTR_USERNAME=%s\nEPTR_PASSWORD=%s\n' \
            "$EPTR_USERNAME" "$EPTR_PASSWORD" > .env
          chmod 600 .env
        env:
          EPTR_USERNAME: ${{ secrets.EPTR_USERNAME }}
          EPTR_PASSWORD: ${{ secrets.EPTR_PASSWORD }}

      - name: Run daily pipeline
        # EPIAS/OpenMeteo gecici erisilemezliginde kendini iyilestir:
        # 3 deneme, aralarinda 10dk bekleme (~45dk kesintiye kadar dayanir).
        # Uc deneme de basarisizsa step fail eder -> run failure mail'i (durust yalanci basari degil).
        run: |
          ok=0
          for i in 1 2 3; do
            echo "=== daily pipeline deneme ${i}/3 ($(date -u +%H:%M:%SZ)) ==="
            if python -m scripts.daily_run; then
              ok=1
              break
            fi
            echo "--- deneme ${i}/3 basarisiz"
            [ "$i" -lt 3 ] && sleep 600
          done
          if [ "$ok" != "1" ]; then
            echo "PIPELINE_FAILED_3_ATTEMPTS — gunluk tahmin uretilemedi"
            exit 1
          fi

      - name: Build PTF input features (non-blocking)
        # Tuketim hattindan SONRA calisir, onu bloklamaz (continue-on-error).
        continue-on-error: true
        run: python -m scripts.build_ptf_features

      - name: Commit results
        shell: bash
        run: |
          git config user.name  "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && echo "degisiklik yok" || {
            git commit -m "daily: $(date -u +%F)-$(TZ='Europe/Istanbul' date +%H%M) forecast + mape"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:${GITHUB_REF#refs/heads/}
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PTF sanity check (latest.parquet butunluk + tazelik)
        # Sert adim (continue-on-error YOK): tuketim tahmini zaten commitlendi,
        # bu adim sadece PTF tarafi stale/bozuksa run'i kirmiziya cevirir.
        run: python -m scripts.check_ptf_latest --max-age-days 2
